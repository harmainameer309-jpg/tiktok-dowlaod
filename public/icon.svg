<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Glowing concentric backdrop -->
  <circle cx="256" cy="256" r="140" fill="url(#accentGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Brand TokHD Icon: Downloader arrow with play pulse -->
  <g transform="translate(136, 120)">
    <!-- Download Arrow Box -->
    <path d="M120 18 L120 150 M75 105 L120 150 L165 105" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Base Tray -->
    <path d="M30 155 L30 200 C30 215 42 225 58 225 L182 225 C198 225 210 215 210 200 L210 155" 
          fill="none" 
          stroke="#38bdf8" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Dynamic Sparkle Accent -->
    <circle cx="180" cy="50" r="12" fill="#22d3ee"/>
    <circle cx="60" cy="70" r="8" fill="#818cf8"/>
  </g>

  <!-- HD Badge -->
  <rect x="186" y="380" width="140" height="42" rx="21" fill="#0369a1" />
  <text x="256" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="3">TOK HD</text>
</svg>
